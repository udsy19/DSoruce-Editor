[package]
name = "ds-core"
version = "0.1.0"
edition = "2021"
description = "DSource Editor core: geometry, document model, and (future) layout engine, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: without it serde_json's PARSER may land 1 ULP off on
# f64s, so save → reopen shifted coordinates by ~1e-16 and a room whose area
# sits exactly on a capacity boundary (a module-snapped 3.0×2.0 storage at the
# 6.0 m²/seat Amenity rate) reopened with capacity 1 → 0 — the precise defect
# S02.reopen.is_lossless_on_every_published_surface exists to catch, and the
# precise loss this feature exists to prevent.
serde_json = { version = "1", features = ["float_roundtrip"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
